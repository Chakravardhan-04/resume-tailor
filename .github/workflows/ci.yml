# Runs on every push and pull request: tests for the Lambdas, the frontend and the CDK app.
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Lambdas (ruff + pytest)
        working-directory: lambdas
        run: pip install -r requirements-dev.txt && ruff check . && pytest -q

      - name: Frontend (lint, typecheck, test, build)
        working-directory: frontend
        run: npm ci && npm run lint && npm test && npm run build

      - name: Infra (jest + cdk synth)
        working-directory: infra
        run: npm ci && npm test && npx cdk synth --quiet -c senderEmail=ci@example.com
